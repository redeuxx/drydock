name: CI

# Runs on a self-hosted Forgejo runner only; the repo has no GitHub Actions workflow.
#
# Every job drives the runner host's Docker daemon (the runner mounts its socket), which
# also runs Forgejo. So each job has its own Compose project, and runs never overlap: the
# integration tests remove every container labelled drydock.test on that daemon. A newer
# push cancels the run in progress; a cancelled job may skip its cleanup, so the next run
# removes what earlier runs left behind.
#
# A tag vX.Y.Z runs the same jobs, then publishes the image for amd64 and arm64 with an
# SBOM and provenance (the multiarch job). Push the branch first and the tag after: a push
# cancels the run in progress, including a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ci-drydock
  cancel-in-progress: true

env:
  # Copies the checkout into the volume compose.ci.yaml mounts at /src.
  BUSYBOX: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
  TRIVY: docker.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  # QEMU for the arm64 stages of the multi-arch build, and the BuildKit that runs it (the
  # daemon's own builder cannot build several platforms or attach attestations).
  BINFMT: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDKIT: docker.io/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

jobs:
  python:
    name: Ruff and pytest (Python ${{ matrix.python }})
    runs-on: docker
    timeout-minutes: 40
    # Every Python that requires-python allows. Forgejo ignores max-parallel, so both run
    # at once on one daemon: tests label their helpers with an installation ID of their
    # own run (tests/docker_support.py TEST_INSTANCE) and touch nothing else they did not make.
    strategy:
      matrix:
        include:
          - python: "3.15"
            slug: py315
            image: python:3.15.2-slim@sha256:c4158543ecb725b99e57d129dfd43d761d4c43e4577b5e23326aabb223cf7f4e
          - python: "3.14"
            slug: py314
            image: python:3.14.10-slim@sha256:3cabfd7d7aaf394e6040e79fa1eec6ca1c52b74ed9188650472695d9a9326999
    env:
      COMPOSE_PROJECT_NAME: drydock-ci-${{ github.run_id }}-${{ matrix.slug }}
      DRYDOCK_TEST_PYTHON_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove what cancelled runs left behind
        run: |
          # compose down keeps the one-off `compose run` container, which a cancelled job
          # leaves running (with its volumes in use), so remove containers by label first.
          for p in $(docker compose ls -a -q | grep '^drydock-ci-' | grep -v "^drydock-ci-${{ github.run_id }}-"); do
            docker ps -aq --filter "label=com.docker.compose.project=$p" | xargs -r docker rm -f || true
            docker compose -p "$p" down --volumes || true
          done
          docker volume ls -q | grep '^drydock-ci-' | grep -v "^drydock-ci-${{ github.run_id }}-" \
            | xargs -r docker volume rm || true
      - name: Copy the checkout into a volume
        run: |
          docker volume create "$COMPOSE_PROJECT_NAME-src"
          tar -cf - . | docker run --rm -i -v "$COMPOSE_PROJECT_NAME-src:/src" "$BUSYBOX" \
            sh -c 'tar -xf - -C /src && chown -R 10001:10001 /src'
      # uv sync --locked, ruff check, ruff format --check, pytest. Starts the socket proxy
      # and the sshhost (docker:dind with sshd) the integration tests use.
      - run: docker compose -f compose.test.yaml -f compose.ci.yaml run --rm tests
      - if: always()
        run: |
          docker compose -f compose.test.yaml -f compose.ci.yaml down --volumes
          docker volume rm "$COMPOSE_PROJECT_NAME-src" || true

  frontend:
    name: TypeScript and npm audit
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: the runner's cache proxy hangs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      # Blocking: the only npm package that ships in the image is htmx.org.
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=low
      # Report only: build tooling never reaches the image.
      - name: npm audit (build tooling)
        run: npm audit --audit-level=high || echo "::warning::npm audit reports issues in build tooling"

  python-audit:
    name: pip-audit
    runs-on: docker
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: drydock-ci-${{ github.run_id }}-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the checkout into a volume
        run: |
          docker volume create "$COMPOSE_PROJECT_NAME-src"
          tar -cf - . | docker run --rm -i -v "$COMPOSE_PROJECT_NAME-src:/src" "$BUSYBOX" \
            sh -c 'tar -xf - -C /src && chown -R 10001:10001 /src'
      - run: >-
          docker compose -f compose.test.yaml -f compose.ci.yaml run --rm --no-deps
          -e HOME=/tmp -e UV_TOOL_DIR=/tmp/uv-tools
          tests sh -c 'uv export --locked --no-dev --no-emit-project --format requirements-txt
          -o /tmp/requirements.txt -q
          && uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r /tmp/requirements.txt'
      - if: always()
        run: |
          docker compose -f compose.test.yaml -f compose.ci.yaml down --volumes
          docker volume rm "$COMPOSE_PROJECT_NAME-src" || true

  image:
    name: Image build and CSP smoke test
    runs-on: docker
    timeout-minutes: 30
    # The compose file's own project name (drydock-test): the smoke test backs up
    # drydock-test-smoke-target-1 by name. The other jobs use other names.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No bind mounts here: build contexts are uploaded from the job.
      - run: docker compose -f compose.test.yaml build app smoke
      - run: >-
          docker compose -f compose.test.yaml up
          --abort-on-container-exit --exit-code-from smoke app smoke
      - if: always()
        run: docker compose -f compose.test.yaml down --volumes

  multiarch:
    name: amd64 and arm64 image, scan, and release on tags
    # Last: the emulated build is the heaviest load on the shared host, and a tag publishes
    # only an image whose commit passed every other job.
    needs: [python, frontend, python-audit, image]
    runs-on: docker
    timeout-minutes: 60
    env:
      BUILDER: drydock-ci-${{ github.run_id }}-multiarch
      ARM64_IMAGE: drydock-ci-${{ github.run_id }}:arm64
      # Registry credentials stay in the job container, never in the host's config.
      DOCKER_CONFIG: /tmp/docker-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A release tag is vX.Y.Z of the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ] || ! echo "$version" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "Tag $GITHUB_REF_NAME is not v$version, or $version is not X.Y.Z" >&2
            exit 1
          fi
      # A cancelled run may skip its cleanup and leave its BuildKit container behind.
      # The binfmt registration is kernel-wide until the host reboots; --install repeats
      # safely. It needs --privileged, like the sshhost the tests run.
      - name: Set up arm64 emulation and a builder
        run: |
          docker ps -a --format '{{.Names}}' | grep '^buildx_buildkit_drydock-ci-' | grep -v "drydock-ci-${{ github.run_id }}-" | xargs -r docker rm -f
          docker volume ls -q | grep '^buildx_buildkit_drydock-ci-' | grep -v "drydock-ci-${{ github.run_id }}-" | xargs -r docker volume rm
          docker run --rm --privileged "$BINFMT" --install arm64
          docker buildx create --name "$BUILDER" --driver docker-container --driver-opt "image=$BUILDKIT"
      - name: Build both platforms
        run: >-
          docker buildx build --builder "$BUILDER" --platform linux/amd64,linux/arm64
          --sbom=true --provenance=mode=max --output type=oci,dest=/tmp/drydock-oci,tar=false .
      # index.json points at the image index; each platform's attestation manifest lists
      # its predicates.
      - name: Every platform carries an SBOM and provenance
        run: |
          for predicate in https://spdx.dev/Document https://slsa.dev/provenance/v1; do
            count=$(grep -lF '"in-toto.io/predicate-type": "'"$predicate"'"' /tmp/drydock-oci/blobs/sha256/* | wc -l)
            echo "$predicate: $count"
            test "$count" -eq 2
          done
      # Fails on any high or critical finding not excepted in .trivyignore.yaml. Trivy
      # reads one platform per OCI layout, so each is exported on its own (from the build
      # cache) and reaches the scanner on stdin with the exceptions: a bind mount would
      # resolve on the runner host.
      - name: Scan both platforms
        run: |
          for arch in amd64 arm64; do
            docker buildx build --builder "$BUILDER" --platform "linux/$arch" --output "type=oci,dest=/tmp/drydock-$arch.tar" .
            tar -cf - -C /tmp "drydock-$arch.tar" -C "$GITHUB_WORKSPACE" .trivyignore.yaml | docker run --rm -i -v drydock-ci-trivy-cache:/cache --entrypoint sh "$TRIVY" -c "mkdir -p /w/oci && tar -xf - -C /w && tar -xf /w/drydock-$arch.tar -C /w/oci && exec trivy image --cache-dir /cache --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignorefile /w/.trivyignore.yaml --exit-code 1 --table-mode detailed --input /w/oci"
          done
      - name: The arm64 image starts
        run: |
          docker buildx build --builder "$BUILDER" --platform linux/arm64 --load -t "$ARM64_IMAGE" .
          docker run --rm --platform linux/arm64 --entrypoint sh "$ARM64_IMAGE" -c 'python -c "import uvloop, httptools, argon2, pydantic_core, cryptography.fernet, drydock.archive.verify" && /opt/age/age --version && /opt/rclone/rclone version'
      # REGISTRY_TOKEN: a Forgejo access token with the write:package scope, stored as an
      # Actions secret of the repository. The same builder and inputs as the scanned build,
      # so every layer comes from its cache. Pushes X.Y.Z and X.Y.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          registry=${GITHUB_SERVER_URL#https://}
          image="$registry/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker buildx build --builder "$BUILDER" --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max -t "$image:$version" -t "$image:${version%.*}" --push .
          docker buildx imagetools inspect "$image:$version"
      - if: always()
        run: |
          docker logout "${GITHUB_SERVER_URL#https://}" || true
          docker buildx rm "$BUILDER" || true
          docker image rm "$ARM64_IMAGE" || true
