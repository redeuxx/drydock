{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card mx-auto max-w-sm bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="card-title text-2xl">Log in</h1>
    {% include "_errors.html" %}
    <form method="post" action="/login" class="flex flex-col gap-2">
      <input type="hidden" name="csrf_token" value="{{ form_token }}">
      <div class="fieldset">
        <label class="fieldset-legend" for="login-username">Username</label>
        <input id="login-username" class="input w-full" name="username" autocomplete="username" required maxlength="64" autofocus>
      </div>
      <div class="fieldset">
        <label class="fieldset-legend" for="login-password">Password</label>
        <input id="login-password" class="input w-full" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary mt-2">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
