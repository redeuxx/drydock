{% extends "base.html" %}
{% from "_macros.html" import submit %}
{% block title %}Add user{% endblock %}
{% block content %}
<section class="card mx-auto max-w-md bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="card-title text-2xl">Add user</h1>
    {% include "_errors.html" %}
    <form method="post" action="/users" hx-post="/users" hx-nonce="{{ csp_nonce }}" class="flex flex-col gap-2">
      <input type="hidden" name="csrf_token" value="{{ auth.csrf_token }}">
      <div class="fieldset">
        <label class="fieldset-legend" for="new-username">Username</label>
        <input id="new-username" class="input w-full" name="username" value="{{ username }}" autocomplete="off" required maxlength="64" aria-describedby="new-username-hint">
        <p id="new-username-hint" class="label">Printable characters, no spaces.</p>
      </div>
      <div class="fieldset">
        <label class="fieldset-legend" for="new-user-password">Initial password</label>
        <input id="new-user-password" class="input w-full" type="password" name="password" autocomplete="new-password" required minlength="12" aria-describedby="new-user-password-hint">
        <p id="new-user-password-hint" class="label">At least 12 characters.</p>
      </div>
      <div class="fieldset">
        <label class="fieldset-legend" for="new-user-role">Role</label>
        <select id="new-user-role" class="select w-full" name="role">
          {% for r in Role %}
          <option value="{{ r.name }}"{% if r.name == role %} selected{% endif %}>{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>
      {{ submit("Add user") }}
    </form>
  </div>
</section>
{% endblock %}
