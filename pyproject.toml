[project]
name = "drydock"
version = "0.3.0"
description = "Self-hosted backup and restore for Docker containers, volumes and Compose stacks"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.20.0",
  "apprise==2.0.1",
  "apscheduler==3.11.3",
  "argon2-cffi==25.1.0",
  "asyncssh[bcrypt]==2.24.1",
  "bcrypt==5.0.0",
  "cryptography==50.0.2",
  "docker==7.2.0",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "sqlalchemy==2.1.4",
  "starlette==1.7.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "anyio==4.15.1",
  "pyrage==1.4.0",
  "pytest==9.1.1",
  "ruamel-yaml==0.19.1",
  "ruff==0.17.0",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.0"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"src/drydock/migrations/**" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
# A passing test's tmp_path goes at once: big archives must not pile up for later tests.
tmp_path_retention_policy = "failed"
markers = ["slow: tests that move a gigabyte or more (deselect with -m 'not slow')"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.Query",
  "drydock.security.rbac.require_role",
]
